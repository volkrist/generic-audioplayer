syntax = "proto3";

option java_package = "com.github.pakka_papad.data";
option java_multiple_files = true;

message QueueState {
  repeated string locations = 1;
  int32 startIndex = 2;
  int64 startPositionMs = 3;
  // RepeatMode ordinal: 0 NO_REPEAT, 1 REPEAT_ALL, 2 REPEAT_ONE
  int32 repeat_mode_ordinal = 4;
  // androidx.media3.common.Player shuffle mode (e.g. SHUFFLE_MODE_OFF = 0)
  int32 shuffle_mode = 5;
  bool was_playing = 6;
}